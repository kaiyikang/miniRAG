[project]
name = "minirag"
version = "0.1.0"
description = "A simple, modular RAG system to help you understand the core concepts and implementation principles."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.14.1",
    "requests>=2.32",
    "chromadb>=0.5",
    "llama-index-core>=0.12",
    "llama-index-readers-file>=0.4",
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "langfuse>=4.14.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
    "deltalake>=0.20",
    "pyarrow>=15",
    "pandas>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minirag"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]
# Offline data plane (local Spark + Delta lakehouse). Kept separate from the
# runtime deps: Spark is NOT on the online query path, so the API/RAG core must
# stay installable without it. Delta 4.0 pairs with Spark 4.0.
spark = [
    "pyspark==4.0.0",
    "delta-spark==4.0.0",
]
